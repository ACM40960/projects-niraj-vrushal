[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-profiling-optimization"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
# Explicitly add the repo root to sys.path when running tests, so
# `from src...` imports resolve no matter what directory pytest is
# invoked from (fixes "ModuleNotFoundError: No module named 'src'"
# seen on some Windows setups depending on shell/cwd).
pythonpath = ["."]
testpaths = ["tests"]
